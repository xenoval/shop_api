[project]
name = "shop"
version = "0.0.2"
description = "Приложение для онлайн_магазина"
authors = [
    {name = "xenoval",email = "xenovalexv@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    # Web framework
    "fastapi (>=0.141.1,<0.150.0)",
    "uvicorn (>=0.51.0,<0.60.0)",
    "python-multipart (>=0.0.32,<0.1.0)",

    # Validation & settings
    "pydantic[email] (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",

    # Databases
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.5,<2.0.0)",

    # Auth
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",

    # Pagination
    "fastapi-pagination (>=0.15.16,<0.16.0)",
    "pymongo (>=4.18.1,<5.0.0)",
    "motor (>=3.7.1,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.11"
pytest = "^8.0.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
pytest-cov = "^6.0.0"