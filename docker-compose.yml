services:
#  Контейнер Postgres
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: shop
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    # Тестовый контейнер
    postgres_test:
        image: postgres:16
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: shop_test
        ports:
            - "5434:5432"
    
    app:
        build: .
        ports:
            - "8000:8000"
        environment:
            DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/shop
            SECRET_KEY: ${SECRET_KEY}
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: 30
        depends_on:
            - postgres

volumes:
    postgres_data: