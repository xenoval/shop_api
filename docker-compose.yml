services:
#  Контейнер MySQL
    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: shop
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

#  Контейнер MongoDB
    mongodb:
        image: mongo:latest
        container_name: mongodb
        restart: always
        ports:
            - "27017:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD: secretpassword
        volumes:
            - mongodb_data:/data/db

#  Контейнер mongo-express (веб-интерфейс для визуального просмотра MongoDB)
    mongo-express:
        image: mongo-express:latest
        container_name: mongo-express
        restart: always
        ports:
            - "8081:8081"
        environment:
            ME_CONFIG_MONGODB_ADMINUSERNAME: root
            ME_CONFIG_MONGODB_ADMINPASSWORD: secretpassword
            ME_CONFIG_MONGODB_SERVER: mongodb

volumes:
    mongodb_data:
    postgres_data: